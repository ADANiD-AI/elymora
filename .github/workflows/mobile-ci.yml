name: Build Mobile Apps & Bundles

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Bundle/APK
        run: |
          echo "Building Android Release APK and App Bundle..."
          # React Native / Expo / Android Gradle build trigger
          if [ -d "android" ]; then
            cd android && ./gradlew assembleRelease && cd ..
          else
            npm run build
          fi
