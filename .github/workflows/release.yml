name: Automated Release & Build

on:
  push:
    tags:
      - 'v*.*.*'       # Triggers on tags like v1.0.0
      - 'v*.*.*-*'     # Triggers on pre-release tags like v0.1.0-alpha

permissions:
  contents: write

jobs:
  build-and-release:
    name: Create GitHub Release & Artifacts
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build Web Project (or Mobile Bundle)
      - name: Build Web App
        run: npm run build

      # Step 5: Archive Build Output into ZIP
      - name: Zip Build Bundle
        run: |
          cd dist
          zip -r ../elymora-web-build.zip .
          cd ..

      # Step 6: Determine if Pre-Release (e.g. -alpha, -beta)
      - name: Check Pre-release Status
        id: check_prerelease
        run: |
          if [[ "${{ github.ref_name }}" =~ - ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      # Step 7: Generate Release & Upload Artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Elymora Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            elymora-web-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
